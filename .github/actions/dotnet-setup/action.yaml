name: .NET Setup
description: Setup .NET SDK and restore solution



runs:
  using: "composite"
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with: 
        dotnet-versions: ${{ inputs.dotnet-versions }}
    
    - name: Restore dependencies
      shell: bash
      run: dotnet restore CSharpTesting.slnx
